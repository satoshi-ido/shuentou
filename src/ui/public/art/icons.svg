<svg xmlns="http://www.w3.org/2000/svg">
  <!-- [I-PLAN-ASSETS] 系統アイコン5種のシンボル集合（[M-UI-HUD]）。線は currentColor で描き、色は系統ごとに CSS が与える。 -->
  <!-- 心気：燈火の形。気を練る系統 -->
  <symbol id="mind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8c1.6 2.6 5.2 5.1 5.2 9.7a5.2 5.2 0 0 1-10.4 0c0-2.7 1.5-4.4 3-5.9.1 2 .9 3.2 2.1 3.8-.3-2.6-.7-4.9.1-7.6z" />
    <path d="M12 21.2v.01" />
  </symbol>
  <!-- 武技：片手剣 -->
  <symbol id="martial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 4.5 9.6 14.4" />
    <path d="M19.5 4.5h-3.6M19.5 4.5v3.6" />
    <path d="M6.8 11.6l5.6 5.6" />
    <path d="M9.6 14.4 4.5 19.5" />
  </symbol>
  <!-- 体勢：盾 -->
  <symbol id="stance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8l7.2 2.9v5.4c0 4.6-3 8.3-7.2 10.1-4.2-1.8-7.2-5.5-7.2-10.1V5.7z" />
    <path d="M12 6.5v11" />
  </symbol>
  <!-- 召喚：呼び出された仮身 -->
  <symbol id="summon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="2.8" />
    <path d="M6.8 20.5c0-3.7 2.3-6.3 5.2-6.3s5.2 2.6 5.2 6.3" />
    <path d="M3.5 5.5h3M5 4v3M17.5 3.5h3M19 2v3" />
  </symbol>
  <!-- 隊列交代：前後の入れ替え -->
  <symbol id="swap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 8.5h14l-3.5-3.5" />
    <path d="M19.5 15.5h-14l3.5 3.5" />
  </symbol>
</svg>
